<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(
          circle at center,
          #1a0505 0%,
          #0a0202 45%,
          #000000 100%
        );
        color: white;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .header {
        position: absolute;
        top: 28px;
        left: 32px;
        right: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .wave {
        width: min(420px, calc(100vw - 48px));
      }

      .bars {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 180px;
      }

      .bars span {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: rgb(70, 74, 86);
      }

      .status {
        margin-top: 12px;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      .dial {
        margin-top: 36px;
        color: #ffffff;
        font-size: 22px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        text-decoration: none;
        border-bottom: 1px solid rgba(220, 38, 38, 0.7);
        padding-bottom: 4px;
      }

      .dial:hover {
        color: #fecaca;
        border-bottom-color: #dc2626;
      }

      .live {
        position: absolute;
        right: 32px;
        top: 80px;
        bottom: 32px;
        width: min(360px, calc(100vw - 64px));
        display: none;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: #0a0202;
        overflow: hidden;
      }

      .live.on {
        display: flex;
      }

      .live-head {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8b93a7;
      }

      .live-state.active {
        color: #dc2626;
      }

      .live-lines {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .live-line {
        font-size: 14px;
        line-height: 1.45;
        color: #c4c9d4;
        white-space: pre-line;
      }

      .live-line b {
        display: block;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #4b5263;
        font-weight: 600;
      }

      .live-line.yuga b {
        color: #dc2626;
      }

      @media (max-width: 900px) {
        .live {
          position: static;
          width: calc(100vw - 32px);
          height: 40vh;
          margin-top: 24px;
        }
      }

      .debug {
        position: absolute;
        bottom: 25px;
        font-size: 11px;
        color: #3f4655;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="logo">Voice</div>
      </div>

      <div class="center">
        <div class="wave">
          <div id="waveBars" class="bars"></div>
        </div>

        <div id="status" class="status">Dial to speak with AI</div>
        <a class="dial" href="tel:+914447614304">+91 44 4761 4304</a>
      </div>
      <div id="live" class="live">
        <div class="live-head">
          <span>Live call</span>
          <span id="liveState" class="live-state"></span>
        </div>
        <div id="liveLines" class="live-lines"></div>
      </div>
      <!-- <div id="debug" class="debug">probability: 0.000</div> -->
    </div>

    <script>
      // Bars whose heights morph with the VAD speech probability.
      class ProbabilityBars {
        constructor(container, { count = 10, rest, active }) {
          this.container = container;
          this.rest = rest;
          this.active = active;
          this.target = 0;
          this.level = 0;
          this.time = 0;
          this.last = 0;
          this.bars = Array.from({ length: count }, (_, i) => {
            const el = document.createElement("span");
            container.append(el);
            // Bell-shaped profile: centre bars reach higher than the edges.
            const c = (i - (count - 1) / 2) / ((count - 1) / 2);
            return {
              el,
              shape: 0.4 + 0.6 * Math.cos((c * Math.PI) / 2),
              // Neighbouring bars share a phase offset so motion flows across the row.
              phase: i * 0.55 + Math.random() * 0.6,
            };
          });
          this.resize();
          window.addEventListener("resize", () => this.resize());
        }

        resize() {
          this.height = this.container.clientHeight;
          this.minHeight = this.bars[0].el.clientWidth || 5;
        }

        setProbability(p) {
          this.target = Math.max(0, Math.min(1, p));
        }

        frame(now) {
          const dt = this.last ? Math.min(0.05, (now - this.last) / 1000) : 0;
          this.last = now;
          // Fast attack, slower release, like the endpointer's hysteresis.
          const rate = this.target > this.level ? 14 : 5;
          this.level += (this.target - this.level) * (1 - Math.exp(-dt * rate));
          // Motion speeds up as the model grows more confident there is speech.
          this.time += dt * (0.5 + this.level * 1.8);
          this.draw();
        }

        draw() {
          const { rest, active, level } = this;
          const color = rest.map((v, i) => Math.round(v + (active[i] - v) * level)).join(", ");
          this.bars.forEach((bar) => {
            // Two travelling waves in opposite directions keep the shape organic.
            const wobble =
              0.5 +
              0.3 * Math.sin(this.time * 6 + bar.phase) +
              0.2 * Math.sin(this.time * 9.5 - bar.phase * 1.3);
            const breathe = 0.04 * (1 + Math.sin(this.time * 2 + bar.phase));
            const energy = Math.min(1, level * bar.shape * wobble + breathe);
            const h = this.minHeight + (this.height - this.minHeight) * energy;
            bar.el.style.height = `${h.toFixed(1)}px`;
            bar.el.style.background = `rgb(${color})`;
          });
        }
      }

      const wave = new ProbabilityBars(document.getElementById("waveBars"), {
        count: 24,
        rest: [70, 74, 86],
        active: [220, 38, 38],
      });

      function renderWave(now) {
        wave.frame(now);
        requestAnimationFrame(renderWave);
      }

      requestAnimationFrame(renderWave);

      // Phone-call transcripts pushed by the server on /live. Reconnects if the server restarts.
      const live = document.getElementById("live");
      const liveLines = document.getElementById("liveLines");
      const liveState = document.getElementById("liveState");

      function addLiveLine(who, text) {
        const line = document.createElement("div");
        line.className = `live-line ${who === "Yuga" ? "yuga" : ""}`;
        const label = document.createElement("b");
        label.textContent = who;
        line.append(label, text);
        liveLines.append(line);
        liveLines.scrollTop = liveLines.scrollHeight;
      }

      function connectLive() {
        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        const feed = new WebSocket(`${wsProtocol}//${location.host}/live`);

        feed.onmessage = (event) => {
          const message = JSON.parse(event.data);
          if (message.type !== "live") return;

          if (message.event === "start") {
            liveLines.replaceChildren();
            live.classList.add("on");
            liveState.textContent = "In progress";
            liveState.classList.add("active");
          } else if (message.event === "end") {
            liveState.textContent = "Ended";
            liveState.classList.remove("active");
          } else if (message.text?.trim()) {
            live.classList.add("on");
            addLiveLine(message.event === "response" ? "Yuga" : "Caller", message.text);
          }
        };

        feed.onclose = () => setTimeout(connectLive, 3000);
      }

      connectLive();
    </script>
  </body>
</html>
