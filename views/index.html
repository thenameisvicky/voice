<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(
          circle at center,
          #1a0505 0%,
          #0a0202 45%,
          #000000 100%
        );
        color: white;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .header {
        position: absolute;
        top: 28px;
        left: 32px;
        right: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      .connection {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #8b93a7;
        font-size: 13px;
      }

      .connection-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #555;
      }

      .connection-dot.connected {
        background: #dc2626;
        box-shadow: 0 0 10px rgba(220, 38, 38, 0.7);
      }

      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .wave {
        width: min(420px, calc(100vw - 48px));
      }

      .wave canvas {
        display: block;
        width: 100%;
        height: 180px;
      }

      .wave-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #4b5263;
      }

      .wave-value {
        color: #c4c9d4;
        font-variant-numeric: tabular-nums;
      }

      .status {
        margin-top: 12px;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      .subtitle {
        margin-top: 8px;
        font-size: 14px;
        color: #6f778a;
      }

      .mic-button {
        margin-top: 36px;
        width: 56px;
        height: 56px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 200ms ease,
          transform 150ms ease,
          200ms ease;
      }

      .mic-button:hover {
        background: rgba(255, 255, 255, 0.09);
        box-shadow: 0 0 15px rgba(220, 38, 38, 0.2);
      }

      .mic-button:active {
        transform: scale(0.94);
      }

      .mic-button.active {
        background: rgba(220, 38, 38, 0.2);
        border-color: rgba(220, 38, 38, 0.5);
      }

      .mic-icon {
        width: 20px;
        height: 20px;
      }

      .debug {
        position: absolute;
        bottom: 25px;
        font-size: 11px;
        color: #3f4655;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="logo">Voice</div>
        <div class="connection">
          <div id="connectionDot" class="connection-dot"></div>
          <span id="connectionText">Disconnected</span>
        </div>
      </div>

      <div class="center">
        <div class="wave">
          <canvas id="waveCanvas"></canvas>
          <div class="wave-meta">
            <span>Speech probability</span>
            <span id="probabilityValue" class="wave-value">0.00</span>
          </div>
        </div>

        <div id="status" class="status">Not listening</div>
        <div id="subtitle" class="subtitle">Press the microphone to start</div>

        <button id="micButton" class="mic-button">
          <svg
            class="mic-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10a7 7 0 0 0 14 0" />
            <line x1="12" y1="19" x2="12" y2="22" />
            <line x1="8" y1="22" x2="16" y2="22" />
          </svg>
        </button>
      </div>
      <!-- <div id="debug" class="debug">probability: 0.000</div> -->
    </div>

    <script>
      const micButton = document.getElementById("micButton");
      const probabilityValue = document.getElementById("probabilityValue");
      const status = document.getElementById("status");
      const subtitle = document.getElementById("subtitle");
      const debug = document.getElementById("debug");
      const connectionDot = document.getElementById("connectionDot");
      const connectionText = document.getElementById("connectionText");

      let socket = null;
      let audioContext = null;
      let stream = null;
      let processor = null;

      async function startVoice() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
            },
          });

          audioContext = new AudioContext();
          socket = new WebSocket("ws://localhost:3000");
          socket.binaryType = "arraybuffer";

          socket.onopen = async () => {
            connectionDot.classList.add("connected");
            connectionText.textContent = "Connected";
            await audioContext.audioWorklet.addModule("./audioProcessor.js");

            const source = audioContext.createMediaStreamSource(stream);
            processor = new AudioWorkletNode(audioContext, "audio-processor");

            processor.port.onmessage = (event) => {
              const pcm16Buffer = event.data;
              if (socket.readyState !== WebSocket.OPEN) return;
              socket.send(pcm16Buffer);
            };

            source.connect(processor);
            micButton.classList.add("active");
            status.textContent = "Listening";
            subtitle.textContent = "Speak into your microphone";
          };

          socket.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.type !== "voice_event") return;
            updateVoiceUI(message.event, message.probability, message.text);
          };

          socket.onerror = (error) => console.error("WebSocket error:", error);
          socket.onclose = () => {
            connectionDot.classList.remove("connected");
            connectionText.textContent = "Disconnected";
            wave.setProbability(0);
          };
        } catch (error) {
          console.error("Failed to start voice:", error);
        }
      }

      class ProbabilityWave {
        constructor(canvas, { barWidth = 3, gap = 3, speed = 70 } = {}) {
          this.canvas = canvas;
          this.ctx = canvas.getContext("2d");
          this.step = barWidth + gap;
          this.barWidth = barWidth;
          this.speed = speed;
          this.target = 0;
          this.level = 0;
          this.phase = 0;
          this.shift = 0;
          this.bars = [];
          this.last = 0;
          this.resize();
          window.addEventListener("resize", () => this.resize());
        }

        resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const rect = this.canvas.getBoundingClientRect();
          this.width = rect.width;
          this.height = rect.height;
          this.canvas.width = rect.width * dpr;
          this.canvas.height = rect.height * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const count = Math.ceil(this.width / this.step) + 2;
          while (this.bars.length < count) this.bars.unshift(this.makeBar());
          this.bars.splice(0, Math.max(0, this.bars.length - count));
        }

        setProbability(p) {
          this.target = Math.max(0, Math.min(1, p));
        }

        makeBar() {
          const k = this.target > this.level ? 0.45 : 0.14;
          this.level += (this.target - this.level) * k;
          this.phase += 0.55 + Math.random() * 0.35;
          const syllable =
            0.35 + 0.65 * Math.abs(Math.sin(this.phase)) * (0.7 + Math.random() * 0.3);
          const idle = Math.random() * 0.03;
          return { amp: Math.max(idle, this.level * syllable), p: this.level };
        }

        frame(now) {
          const dt = this.last ? Math.min(0.05, (now - this.last) / 1000) : 0;
          this.last = now;
          this.shift += dt * this.speed;
          while (this.shift >= this.step) {
            this.shift -= this.step;
            this.bars.shift();
            this.bars.push(this.makeBar());
          }
          this.draw();
        }

        draw() {
          const { ctx, width, height } = this;
          const mid = height / 2;
          const maxH = height / 2 - 4;
          ctx.clearRect(0, 0, width, height);

          ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
          ctx.fillRect(0, mid - 0.5, width, 1);

          for (let i = 0; i < this.bars.length; i++) {
            const bar = this.bars[i];
            const x = i * this.step - this.shift;
            const h = Math.max(1.5, bar.amp * maxH);
            // Grey when silent, red as probability rises; fade older bars.
            const r = Math.round(70 + (220 - 70) * bar.p);
            const g = Math.round(74 + (38 - 74) * bar.p);
            const b = Math.round(86 + (38 - 86) * bar.p);
            const edge = Math.max(0, Math.min(1, x / (width * 0.3)));
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.25 + 0.75 * edge})`;
            ctx.beginPath();
            ctx.roundRect(x, mid - h, this.barWidth, h * 2, this.barWidth / 2);
            ctx.fill();
          }
        }
      }

      const wave = new ProbabilityWave(document.getElementById("waveCanvas"));
      let shownProbability = 0;

      function renderWave(now) {
        wave.frame(now);
        shownProbability += (wave.level - shownProbability) * 0.2;
        probabilityValue.textContent = shownProbability.toFixed(2);
        requestAnimationFrame(renderWave);
      }

      requestAnimationFrame(renderWave);

      function updateVoiceUI(event, probability, text) {
        if (typeof probability === "number") {
          wave.setProbability(probability);
        }

        if (event === "transcript") {
          setTranscript(text);
        }
      }

      function setTranscript(text) {
        if (text.trim() !== "") {
          status.textContent = text;
        }
        subtitle.textContent = "Speak into your microphone";
      }

      micButton.addEventListener("click", async () => {
        if (socket && socket.readyState === WebSocket.OPEN) return;
        await startVoice();
      });
    </script>
  </body>
</html>
